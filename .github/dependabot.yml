version: 2
updates:
  # Actions are referenced by tag today. Dependabot rewrites them to pinned
  # commit SHAs, which is the supply-chain posture Stirling-PDF uses in this
  # workspace and what OSSF Scorecard checks for.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    labels: ["ci", "dependencies"]
    commit-message: { prefix: "ci" }
    open-pull-requests-limit: 3
    # Only security/patch drift. Major action bumps are almost always wrong
    # (it proposed actions/checkout v4 -> v7, which does not exist) and the
    # noise trains people to ignore Dependabot entirely.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "deps" }
    groups:
      next:
        patterns: ["next", "react", "react-dom", "@types/react*"]
      tooling:
        patterns: ["eslint*", "typescript", "vitest", "@playwright/*", "@ast-grep/*"]
