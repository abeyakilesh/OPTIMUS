# Reusable · GATE 4 — AI security review of the diff.
# Fails loudly when ANTHROPIC_API_KEY is missing. An unconfigured security
# gate must never render as a pass (Prime Directive #4).
name: "gate:ai-review"
on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: claude security review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error title=Gate 4 unconfigured::ANTHROPIC_API_KEY is not set."
            echo "Settings → Secrets and variables → Actions → new repository secret."
            echo "This gate fails by design until then — see CI_STATUS.md."
            exit 1
          fi
      - uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
