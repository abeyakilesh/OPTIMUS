# Reusable · GATE 4 — AI security review of the diff.
#
# Runs WITHOUT a paid Anthropic key. OmniRoute is installed inside the job as
# a local child process and fronts the free provider tiers (Groq / Mistral /
# Gemini) behind an Anthropic-compatible `/v1/messages` endpoint on
# localhost:20128. Claude Code honours ANTHROPIC_BASE_URL, so the reviewer
# talks to the gateway instead of api.anthropic.com.
#
# This is the same shape as production: OmniRoute BUNDLED as a local child
# process, never an external API call, never exposed to the internet. The
# runner reaches it on loopback only.
name: "gate:ai-review"

on:
  workflow_call:
    secrets:
      GROQ_API_KEY:
        required: false
      MISTRAL_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: claude security review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          install: "false"

      # Prefer a real Anthropic key if one is ever configured; otherwise fall
      # back to the free gateway. Fail loudly if neither is available — an
      # unconfigured security gate must never render as a pass.
      - name: Choose a model backend
        id: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "mode=anthropic" >> "$GITHUB_OUTPUT"
            echo "Using a direct Anthropic key."
          elif [ -n "$GROQ_API_KEY" ] || [ -n "$MISTRAL_API_KEY" ] || [ -n "$GEMINI_API_KEY" ]; then
            echo "mode=omniroute" >> "$GITHUB_OUTPUT"
            echo "Using the OmniRoute gateway over free provider tiers."
          else
            echo "::error title=Gate 4 unconfigured::No model backend available."
            echo "Set ANTHROPIC_API_KEY, or any of GROQ_API_KEY / MISTRAL_API_KEY /"
            echo "GEMINI_API_KEY, under Settings -> Secrets and variables -> Actions."
            echo "This gate fails by design until then. See CI_STATUS.md."
            exit 1
          fi

      - name: Start OmniRoute gateway
        if: steps.backend.outputs.mode == 'omniroute'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Bind to loopback only. Never expose the gateway off the runner.
          #
          # `HOST` IS THE WRONG VARIABLE AND WAS DOING NOTHING. OmniRoute
          # v3.8.50 prints, on every start under this workflow:
          #
          #   ⚠ SECURITY: listening on 0.0.0.0 with NO API-key requirement …
          #     bind loopback with OMNIROUTE_SERVER_HOST=127.0.0.1
          #
          # So the comment above described a control that did not exist — the
          # gateway was reachable on every interface of the runner for the life
          # of the job, while the workflow read as though it were confined.
          # THE ENFORCEMENT RULE: the mechanism is named on the line now.
          OMNIROUTE_SERVER_HOST: 127.0.0.1
          HOST: 127.0.0.1 # kept: harmless, and some builds do read it
          PORT: "20128"
        run: |
          # `npm i -g omniroute` pulls ~1,200 packages (tfjs, transformers,
          # aws-sdk). It is the heaviest single step in the gauntlet and it
          # fails transiently. Two problems were fixed here after it blocked
          # every PR for an afternoon:
          #
          #   1. The step runs under `bash -e`, so a failed install aborted
          #      immediately and the ONLY surviving line was a pointer to an
          #      npm debug log on a runner that no longer exists. The job then
          #      reported "OmniRoute did not become healthy in 60s", which was
          #      false — it never reached the health loop at all. A failure
          #      that misreports its own cause is the same defect as a green
          #      check on nothing.
          #   2. No retry on a large network fetch.
          # Redirect to a file rather than `| tee`: under a pipeline the exit
          # status is tee's, not npm's, so the first version of this retry
          # `break`ed on a FAILED install and then tried to run a binary that
          # was never installed ("nohup: failed to run command 'omniroute'").
          # The retry loop reported success while installing nothing.
          for attempt in 1 2 3; do
            echo "npm i -g omniroute (attempt ${attempt}/3)"
            if npm i -g omniroute --no-fund --no-audit > /tmp/npm-omniroute.log 2>&1; then
              echo "installed on attempt ${attempt}"
              break
            fi
            echo "----- npm console output -----"
            cat /tmp/npm-omniroute.log || true
            # npm prints only a POINTER to its debug log on the console, so the
            # actual cause lives in a file on a runner that is about to be
            # destroyed. Print it, or every future failure is undiagnosable.
            echo "----- npm debug log -----"
            for f in /home/runner/.npm/_logs/*-debug-*.log; do
              [ -e "$f" ] && { echo "== $f"; tail -60 "$f"; }
            done
            if [ "${attempt}" = "3" ]; then
              echo "::error title=Gate 4::npm could not install omniroute after 3 attempts. This is an INSTALL failure, not a gateway health failure — the cause is printed above."
              exit 1
            fi
            echo "retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          command -v omniroute >/dev/null || {
            echo "::error title=Gate 4::npm reported success but the omniroute binary is not on PATH."
            exit 1
          }
          nohup omniroute > /tmp/omniroute.log 2>&1 &
          # Health-gate the startup rather than sleeping a fixed amount.
          #
          # THE PROBE ASKS "IS IT ANSWERING", NOT "IS THIS ENDPOINT AUTHORISED",
          # and the difference is what blocked every PR in the repo.
          #
          # It was `curl -sf .../v1/models`. `-f` makes curl exit non-zero on
          # any status >= 400, so an endpoint that answers 401 or 404 is
          # indistinguishable from a socket that is not listening. OmniRoute's
          # API is authenticated — `setup-local-ollama-provider.sh` logs in at
          # `/api/auth/login` before it can call `/api/provider-nodes` — so the
          # unauthenticated probe never returned 2xx. The gateway's own log in
          # the same job said `✔ OmniRoute is running! (started in 2.5s)` while
          # this loop counted to 60 and reported it dead.
          #
          # That is the defect this file's own comments are about: a failure
          # that misreports its own cause. Readiness is "the process accepts a
          # connection and speaks HTTP". Whether a given route needs a cookie
          # is a different question and not this loop's business.
          #
          # `%{http_code}` is `000` when curl could not connect at all, which
          # is the only condition that still means "not up yet". Any real
          # status — 200, 401, 404 — means the server is there.
          last=""
          for i in $(seq 1 60); do
            # `|| last="000"`, NOT `|| echo 000` inside the substitution: on a
            # refused connection curl BOTH prints `000` and exits non-zero, so
            # the echo would append a second one and `last` would be "000000"
            # — not equal to "000", so the loop would declare the gateway up.
            # A retry guard that reports success on failure is the same defect
            # as the install retry two steps above.
            last=$(curl -s -o /tmp/probe.out -w '%{http_code}' --max-time 5 \
                     http://127.0.0.1:20128/v1/models 2>/dev/null) || last="000"
            if [ "$last" != "000" ]; then
              echo "Gateway up after ${i}s (HTTP ${last} from /v1/models)"
              exit 0
            fi
            sleep 1
          done
          # Say what was actually observed. The previous message asserted a
          # cause it had not measured.
          echo "::error::OmniRoute never accepted a connection on 127.0.0.1:20128 in 60s (last curl code: ${last})."
          echo "----- probe body (last attempt) -----"
          cat /tmp/probe.out 2>/dev/null || true
          echo "----- listening sockets -----"
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | head -20 || true
          echo "----- gateway log -----"
          tail -50 /tmp/omniroute.log
          exit 1

      - name: Review the diff
        uses: anthropics/claude-code-security-review@main
        env:
          # Ignored when mode=anthropic (the action's own key wins).
          ANTHROPIC_BASE_URL: ${{ steps.backend.outputs.mode == 'omniroute' && 'http://127.0.0.1:20128' || '' }}
          ANTHROPIC_AUTH_TOKEN: ${{ steps.backend.outputs.mode == 'omniroute' && 'omniroute-local' || '' }}
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY || 'omniroute-local' }}
          comment-pr: true

      - name: Gateway logs on failure
        if: failure() && steps.backend.outputs.mode == 'omniroute'
        run: tail -100 /tmp/omniroute.log || true
