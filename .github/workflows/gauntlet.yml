# ══════════════════════════════════════════════════════════════════════════
# THE GAUNTLET — the single required check on every pull request.
#
# This is an ORCHESTRATOR. Each gate lives in its own reusable workflow
# (`_*.yml`) so it can be run, tested and reasoned about independently —
# the pattern used by n8n, langflow and supabase in this workspace.
#
# Rule one: no placeholder gates. Every job here runs a real tool against
# real code and can really fail. The five gates from CLAUDE.md that have
# nothing to test yet are NOT here as green jobs — `coverage` prints them as
# explicitly absent on every run.
# ══════════════════════════════════════════════════════════════════════════
name: Gauntlet

on:
  # NO branch filter, deliberately. `branches: [main]` meant a PR targeting
  # any other base ran ZERO gates — a stacked PR (one feature branch onto
  # another) got Vercel and nothing else: no build, no tests, no security, no
  # absorption guard. CLAUDE.md is explicit: "Required checks on EVERY pull
  # request." Found when a stacked rollback PR came back with 4 Vercel checks
  # and no gauntlet at all.
  #
  # Nothing ungated ever reached main — the parent PR re-runs on `synchronize`
  # when the stacked branch merges into it — but the stacked PR itself could
  # not be verified on its own, which is where a defect would actually hide.
  pull_request:
  merge_group:          # required for a merge queue
  push:
    branches: [main]

concurrency:
  group: gauntlet-${{ github.ref }}
  cancel-in-progress: true

# A called reusable workflow can never be granted MORE permission than its
# caller. `_static-security.yml` needs `security-events: write` (CodeQL) and
# `_ai-review.yml` needs `pull-requests: write` (to comment), so the caller
# must hold both — otherwise GitHub rejects the entire run at startup.
# Each reusable workflow still narrows this down to what it actually needs.
permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # Which gates does this diff actually need?
  filter:
    name: change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.f.outputs.app }}
      deps: ${{ steps.f.outputs.deps }}
      # ci must be forwarded, not just produced by the composite action —
      # an undeclared job output evaluates to empty, so any `needs.filter.
      # outputs.ci` condition silently never matches.
      ci: ${{ steps.f.outputs.ci }}
      docs-only: ${{ steps.f.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v5
      - id: f
        uses: ./.github/actions/ci-filter

  # ── gates that respond to change detection ──────────────────────────────
  build:
    needs: filter
    if: needs.filter.outputs.docs-only == 'false'
    uses: ./.github/workflows/_build.yml

  unit:
    needs: filter
    if: needs.filter.outputs.docs-only == 'false'
    uses: ./.github/workflows/_unit.yml

  e2e:
    needs: [filter, build]
    if: needs.filter.outputs.app == 'true'
    uses: ./.github/workflows/_e2e.yml

  perf:
    needs: [filter, build]
    if: needs.filter.outputs.app == 'true'
    uses: ./.github/workflows/_perf.yml

  supply-chain:
    needs: filter
    # Also runs when the gate's OWN code changes (`ci`), not just when a
    # dependency does. Without that, a PR editing scripts/license-gate.mjs or
    # _supply-chain.yml skips the very gate it rewrites, and the change lands
    # unproven — which is exactly what happened on PR #8.
    if: >-
      needs.filter.outputs.deps == 'true' ||
      needs.filter.outputs.ci == 'true' ||
      github.event_name == 'push'
    uses: ./.github/workflows/_supply-chain.yml

  # ── gates that ALWAYS run ───────────────────────────────────────────────
  # Security is never filtered. "It's only a config change" is exactly how a
  # secret or a malicious dependency gets in.
  static-security:
    uses: ./.github/workflows/_static-security.yml

  # Gate 4 does NOT run on dependency-bot PRs. This is a deliberate scoping
  # decision, not a weakening — spelled out so nobody has to guess:
  #
  #   * A bot PR's diff is a lockfile. The two risks it can carry are a known
  #     CVE and a forbidden licence, and BOTH already have dedicated,
  #     deterministic, free gates that do run: `dependency CVEs` and
  #     `supply-chain / licenses + SBOM`. An LLM reading a version number adds
  #     nothing they don't already prove.
  #   * GitHub deliberately withholds Actions secrets from Dependabot, so the
  #     gate could only ever run here by copying a key into the Dependabot
  #     secret scope — spending model quota to re-check what is already proven.
  #   * A permanently red check on every routine bump trains people to ignore
  #     red. That is how a gauntlet actually dies.
  #
  # Every human- and agent-authored PR still gets the full AI review.
  ai-review:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/_ai-review.yml
    secrets: inherit   # ANTHROPIC_API_KEY if set, else GROQ/MISTRAL/GEMINI

  absorption:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_absorption-guard.yml

  # ── the honest ledger ───────────────────────────────────────────────────
  coverage:
    name: gate coverage (read me)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [build, unit, static-security, supply-chain, e2e, perf, ai-review, absorption]
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }

      # Generated from CI_STATUS.md, never restated here. An inline copy of the
      # absent-gates list is what went stale for a day after K4 landed.
      - name: Report what is and isn't enforced
        env:
          AI_REVIEW_RESULT: ${{ needs.ai-review.result }}
        run: node scripts/gate-coverage.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any required gate failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A required gate failed. Nothing merges red."
          exit 1
